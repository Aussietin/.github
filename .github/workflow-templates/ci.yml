name: CI

# Starter caller. Keep the job(s) you need, delete the rest, point the inputs
# at your layout. The heavy lifting lives in Aussietin/.github reusable workflows.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    uses: Aussietin/.github/.github/workflows/ci-python.yml@main
    with:
      working-directory: "."
      python-version: "3.12"

