name: docker-publish (reusable)

# Build and push multi-arch images to GHCR on merge to the default branch (and
# on v* tags). The homelab runs watchtower, which auto-pulls the new :latest —
# so there is no self-hosted runner and no SSH/secrets in the deploy path.
#
# Personal (non-org) GitHub accounts can't share one self-hosted runner across
# repos, which is why deploys moved to this registry-pull model. See
# [[GitHub Dev Workflow - CI, Auto-merge and Deploy]].
#
#   jobs:
#     publish:
#       uses: Aussietin/.github/.github/workflows/docker-publish.yml@main
#       permissions:
#         contents: read
#         packages: write
#       with:
#         images: '[{"image":"myapp-backend","context":"backend"},
#                   {"image":"myapp-frontend","context":"frontend"}]'
#   entry keys: image (required), context (required), dockerfile (optional,
#   default <context>/Dockerfile)

on:
  workflow_call:
    inputs:
      images:
        description: "JSON array of {image, context, dockerfile?} objects"
        type: string
        required: true
      platforms:
        type: string
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.entry.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.entry.context }}
          file: ${{ matrix.entry.dockerfile || format('{0}/Dockerfile', matrix.entry.context) }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.entry.image }}
          cache-to: type=gha,scope=${{ matrix.entry.image }},mode=max
